name: keep-alive
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"   # alle 10 Min, Offsets gegen GitHub-Stau
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Render instand halten
        run: curl -fsS --max-time 30 "${{ secrets.RENDER_URL }}/" -o /dev/null -w "HTTP %{http_code}\n"
